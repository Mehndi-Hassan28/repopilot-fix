name: Cloud Verification Worker

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Target Verification Run ID (optional, claims oldest queued run if omitted)"
        required: false
        type: string
  repository_dispatch:
    types: [repopilot_verify]

concurrency:
  group: repopilot-verification-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Execute Sandbox Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API package
        run: |
          python -m pip install --upgrade pip
          pip install -e ./apps/api

      - name: Pull authoritative sandbox image
        run: |
          docker pull python:3.11-slim

      - name: Run verification worker (single job)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SANDBOX_PROVIDER: docker
          ALLOW_DOCKER_VERIFICATION_EXECUTION: "true"
          LOG_LEVEL: INFO
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured in repository secrets."
            exit 1
          fi
          python -m repopilot_api.worker --once --max-jobs 1 --lease-seconds 60

      - name: Clean up temporary containers
        if: always()
        run: |
          docker container prune -f --filter "label=repopilot.managed=true" || true
