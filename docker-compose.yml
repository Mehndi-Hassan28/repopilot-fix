services:
  db:
    image: postgres:16-alpine
    container_name: repopilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repopilot}
      POSTGRES_USER: ${POSTGRES_USER:-repopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repopilot_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repopilot} -d ${POSTGRES_DB:-repopilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: repopilot-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-repopilot}:${POSTGRES_PASSWORD:-repopilot_secret_password}@db:5432/${POSTGRES_DB:-repopilot}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-mock}
      ALLOW_DOCKER_VERIFICATION_EXECUTION: "false"
    ports:
      - "8000:8000"
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: repopilot-worker
    restart: unless-stopped
    command: ["python", "-m", "repopilot_api.worker"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-repopilot}:${POSTGRES_PASSWORD:-repopilot_secret_password}@db:5432/${POSTGRES_DB:-repopilot}
      ALLOW_DOCKER_VERIFICATION_EXECUTION: ${ALLOW_DOCKER_VERIFICATION_EXECUTION:-false}
      POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2.0}
    networks:
      - backend-net
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: repopilot-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s

networks:
  backend-net:
    driver: bridge
    internal: true
  frontend-net:
    driver: bridge

volumes:
  postgres_data:
    name: repopilot_postgres_data
